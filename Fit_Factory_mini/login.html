<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./icon/ff.webp">
    <title>Fit Factory</title>
    <style>
      .container-fluid
      {
      background-image: url("./gym-backgrund-img/FF-4.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: grid;
      justify-content: center;
      align-content: center;
      }
        form
        {
         backdrop-filter: blur(1rem);
         border: 1px solid;
         width: 300px;
         border: none;
         height: auto;
        }
        form p
        {
          text-align: center;
        }
        .btn-1
        {
          text-align: center;
        }
        .input_group .error
        {
          color: red;
          font-size: 19px;
          margin-top: 5px;
          text-shadow: 1px 1px 3px red;
          font-weight: 600;
        }
        .input_group .sucess input
        {
          border-color: green !important;
        }
        .input_group .error input
        {
          border-color: red !important;
        }
    </style>
</head>
<body>
  <div class="container-fluid vh-100 vw-100">
    <form id="form">
      <h1 class="text-white text-center">Login</h1>
      <div class=" input_group mb-3 px-3 py-3 text-white ">
        <label for="exampleInputEmail1" class="form-label">Email</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        <div class="error"></div>
        <div id="emailHelp" class="form-text text-white">We'll never share your email with anyone else.</div>
      </div>
      <div class="input_group mb-3 px-3 text-white">
        <label for="exampleInputPassword1" class="form-label text-center">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1">
        <div class="error"></div>
      </div>
      <div class="btn-1"><button type="submit" class="btn btn-primary" onclick="validateInputs" >Submit</button></div>
      <p class="text-white">Don't have an account?<a href="registerpage.html"><b>Register</b></a></p>
    </form>
  </div>
      <script src="js/login.js"></script>
      <!-- <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script>
          AOS.init();
        </script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
