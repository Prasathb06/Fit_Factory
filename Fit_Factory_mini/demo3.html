<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<style>
    .container .col .card
    {
      background-color: gray;
      color: white;
    }
    .container .col .card:hover
    {
      transform: scale(1.1);
    }
  .wrapper
  {
    border: 1x soli white;
    border: none;
    position: absolute;
    width: 80vw;
    transform: translate(-50%, -50%);
    top: 50%;
    left: 50%;
    display: flex;
    
  }
  .container1
  {
    width: 28vmin;
    height: 35vmin;
    border: 1px solid black;
    border: none;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 1em 0;
    position: relative;
    font-size:16px;
    /* border-radius: 0.5em; */
    border-bottom: 0px;
    border-bottom: 1px solid red; 
   }
  span.num
  {
    color: white;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 3em;
  }
  span.text
  {
    color: white;
    /* font-size: 1em; */
    text-align: center;
    pad: 0.7em 0;
    /* font-weight: 400; */
    /* line-height: 0; */
  }

</style>
<body style="background-color: gray;">
    <div class="container wrapper">
        <div class="row row-cols-2 row-cols-sm-2 row-cols-md-4">
          <div class="col">
            <div class="container1">
              <span class="num" data-val="1m">0</span>
              <span class="text">Number of Customer</span>
            </div>
          </div>
          <div class="col">
            <div class="container1">
              <span class="num" data-val="30">0</span>
              <span class="text">Our Clients</span>
            </div>
          </div>
          <div class="col">
            <div class="container1">
              <span class="num" data-val="8000">0</span>
              <span class="text">Number of Products</span>
            </div>
          </div>
          <div class="col">
            <div class="container1">
              <span class="num" data-val="10,000">0</span>
              <span class="text">Weekly Visitors</span>
            </div>
          </div>
        </div>
      </div>
      
          <script src="js/addtocart.js"></script>
          <!-- <script src="arrowbutton.js"></script> -->
            <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
            <script>
              AOS.init();
            </script>
